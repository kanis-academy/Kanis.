name: Build KANIS VPN ACADEMY APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build APK
        run: |
          npm run android:add
          npm run assets
          npm run sync
          npm run build:apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KANIS-VPN-ACADEMY-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
